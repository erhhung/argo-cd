spec:
  # https://docs.gitlab.com/18.3/ci/inputs
  inputs:
    purpose:
      description: Select the purpose of this pipeline
      options:
        - build-deploy # normally triggered pipelines
        - pull-upstream # scheduled recurring pipeline
      default: build-deploy
---
# Bash helper functions automatically sourced when runner build pod starts:
# https://github.com/erhhung/homelab-k8s/tree/main/files/gitlab/ciutils.sh

.sync:
  script:
    - '# ========== .sync =========='
    - git remote add upstream $UPSTREAM
    - git fetch upstream
    - if git merge --ff-only upstream/$CI_COMMIT_BRANCH; then
    - - '# No upstream changes to merge.'
      - exit 0
    - fi
    - git merge upstream/$CI_COMMIT_BRANCH
    - git add .
    - git config user.name gitlab-ci
    - 'git commit -m "chore: pull upstream changes"'
    - git push origin HEAD:$CI_COMMIT_BRANCH

.setup:
  script:
    - '# ========== .setup =========='
    - buildah_login

.build:
  script:
    - !reference [.setup, script]
    - '# ========== .build =========='
    - buildah_build argocd --no-cache -f ./Dockerfile .
    - buildah_push argocd $CI_COMMIT_SHORT_SHA

.deploy:
  script:
    - '# ========== .deploy =========='
    - image="$CI_REGISTRY_PATH/argocd:$CI_COMMIT_SHORT_SHA"
    - '# --- argocd-repo-server ---'
    - set_k8s_image Deployment $NAMESPACE argocd-repo-server initContainer copyutil $image
    - set_k8s_image Deployment $NAMESPACE argocd-repo-server container repo-server $image
    - kubectl rollout restart Deployment -n $NAMESPACE argocd-repo-server
    - '# --- argocd-applicationset-controller ---'
    - set_k8s_image Deployment $NAMESPACE argocd-applicationset-controller container applicationset-controller $image
    - kubectl rollout restart Deployment -n $NAMESPACE argocd-applicationset-controller
    - '# --- argocd-application-controller ---'
    - set_k8s_image StatefulSet $NAMESPACE argocd-application-controller container application-controller $image
    - kubectl rollout restart StatefulSet -n $NAMESPACE argocd-application-controller
    - '# --- argocd-notifications-controller ---'
    - set_k8s_image Deployment $NAMESPACE argocd-notifications-controller container notifications-controller $image
    - kubectl rollout restart Deployment -n $NAMESPACE argocd-notifications-controller
    - '# --- argocd-commit-server ---'
    - set_k8s_image Deployment $NAMESPACE argocd-commit-server container commit-server $image
    - kubectl rollout restart Deployment -n $NAMESPACE argocd-commit-server
    - '# --- argocd-server ---'
    - set_k8s_image Deployment $NAMESPACE argocd-server container server $image
    - kubectl rollout restart Deployment -n $NAMESPACE argocd-server

variables:
  UPSTREAM: https://github.com/erhhung/argo-cd.git
  NAMESPACE: argocd
  # CI_DEBUG: 600

stages:
  - sync
  - build
  - deploy

# ==================== SYNC STAGE ====================

sync:
  stage: sync
  extends: .sync
  needs: []
  rules:
    - if: '"$[[ inputs.purpose ]]" == "pull-upstream"'

# ==================== BUILD STAGE ====================

build:
  stage: build
  extends: .build
  needs: []
  rules:
    - if: '"$[[ inputs.purpose ]]" == "build-deploy"'

# ==================== DEPLOY STAGE ====================

deploy:
  stage: deploy
  extends: .deploy
  needs: ["build"]
  rules:
    - if: '"$[[ inputs.purpose ]]" == "build-deploy"'
