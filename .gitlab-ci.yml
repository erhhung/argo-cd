spec:
  # https://docs.gitlab.com/18.3/ci/inputs
  inputs:
    purpose:
      description: Select the purpose of this pipeline
      options:
        - build-deploy # normally triggered pipelines
        - pull-upstream # scheduled recurring pipeline
      default: build-deploy
---
# Bash helper functions automatically sourced when runner build pod starts:
# https://github.com/erhhung/homelab-k8s/tree/main/files/gitlab/ciutils.sh

.sync:
  script:
    - '# ========== .sync =========='
    - git remote add upstream $UPSTREAM
    - git fetch upstream
    - if git merge --ff-only upstream/$CI_COMMIT_BRANCH; then
    - - '# No upstream changes to merge.'
      - exit 0
    - fi
    - git merge upstream/$CI_COMMIT_BRANCH
    - git add .
    - git config user.name gitlab-ci
    - 'git commit -m "chore: pull upstream changes"'
    - git push origin HEAD:$CI_COMMIT_BRANCH

.setup:
  script:
    - '# ========== .setup =========='
    - buildah_login

.build:
  script:
    - !reference [.setup, script]
    - '# ========== .build =========='
    - buildah_build $IMAGE_NAME --build-arg GIT_TAG=$CI_COMMIT_SHORT_SHA --no-cache -f ./Dockerfile .
    - buildah_push  $IMAGE_NAME $CI_COMMIT_SHORT_SHA

.deploy:
  script:
    - '# ========== .deploy =========='
    - IMAGE="$CI_REGISTRY_PATH/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

    - '# --- argocd-repo-server ---'
    - component='argocd-repo-server'
    - set_k8s_image Deployment $NAMESPACE $component initContainer copyutil $IMAGE
    - set_k8s_image Deployment $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart Deployment -n $NAMESPACE $component

    - '# --- argocd-applicationset-controller ---'
    - component='argocd-applicationset-controller'
    - set_k8s_image Deployment $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart Deployment -n $NAMESPACE $component

    - '# --- argocd-application-controller ---'
    - component='argocd-application-controller'
    - set_k8s_image StatefulSet $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart StatefulSet -n $NAMESPACE $component

    - '# --- argocd-notifications-controller ---'
    - component='argocd-notifications-controller'
    - set_k8s_image Deployment $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart Deployment -n $NAMESPACE $component

    - '# --- argocd-commit-server ---'
    - component='argocd-commit-server'
    - set_k8s_image Deployment $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart Deployment -n $NAMESPACE $component

    - '# --- argocd-server ---'
    - component='argocd-server'
    - set_k8s_image Deployment $NAMESPACE $component container ${component#argocd-} $IMAGE
    - kubectl rollout restart Deployment -n $NAMESPACE $component

variables:
  UPSTREAM: https://github.com/erhhung/argo-cd.git
  IMAGE_NAME: argocd
  NAMESPACE: argocd
  # CI_DEBUG: 600

stages:
  - sync
  - build
  - deploy

# ==================== SYNC STAGE ====================

sync:
  stage: sync
  extends: .sync
  needs: []
  rules:
    - if: '"$[[ inputs.purpose ]]" == "pull-upstream"'

# ==================== BUILD STAGE ====================

build:
  stage: build
  extends: .build
  needs: []
  rules:
    - if: '"$[[ inputs.purpose ]]" == "build-deploy"'

# ==================== DEPLOY STAGE ====================

deploy:
  stage: deploy
  extends: .deploy
  needs: ["build"]
  rules:
    - if: '"$[[ inputs.purpose ]]" == "build-deploy"'
